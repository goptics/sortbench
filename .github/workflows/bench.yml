name: benchmark

on:
  push:
    tags: ['v*']

permissions:
  actions: write
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download previous merged data
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: bench.yml
          name: merged.json
          path: prev

      - name: Run benchmarks, merge, and output
        uses: goptics/vizb@v0.10.0
        with:
          bench-cmd: "go test -bench=."
          tag: ${{ github.ref_name }}
          group-pattern: _y
          name: "Sort Benchmarks"
          scale: log
          merge-dir: prev
          tag-axis: x
          output-json: merged.json
          output-html: pages/index.html

      - name: Upload merged JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged.json
          path: merged.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages
          publish_branch: gh-pages
          force_orphan: true
